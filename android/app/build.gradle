plugins {
    id "com.android.application"
}

def releaseStoreFilePath = System.getenv("DIGICONNECT_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("DIGICONNECT_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("DIGICONNECT_KEY_ALIAS")
def releaseKeyPassword = System.getenv("DIGICONNECT_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFilePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.digiconnectdukan.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.digiconnectdukan.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation "androidx.browser:browser:1.8.0"
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
