<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1F3A" />
    <title>DigiConnect Dukan - Offline</title>
    <style>
      :root {
        color: #0b1f3a;
        background: #ffffff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(1.25rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
          max(1.25rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 12% 6%, rgba(37, 99, 235, 0.1), transparent 17rem),
          linear-gradient(180deg, #ffffff 0%, #eef6ff 100%);
      }

      main {
        width: min(100%, 28rem);
        text-align: center;
      }

      img {
        width: min(11rem, 60vw);
        height: auto;
      }

      h1 {
        margin: 1.5rem 0 0;
        font-size: clamp(1.55rem, 8vw, 2.1rem);
        line-height: 1.15;
      }

      p {
        margin: 0.85rem 0 0;
        color: #4b5d75;
        font-size: 1rem;
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-navbar.png" alt="DigiConnect Dukan" />
      <h1>You are offline. Please check your internet.</h1>
      <p>DigiConnect Dukan needs a live connection for secure dashboards, applications, payments, and customer data.</p>
    </main>
  </body>
</html>
